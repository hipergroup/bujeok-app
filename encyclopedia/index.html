.35);filter:grayscale(1);opacity:0.55"/></div></div><div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="inline-block h-2 w-2 shrink-0 rounded-full" style="background-color:#A72B21"></span><h3 class="truncate font-serif-kr text-sm font-bold text-[var(--color-galsaek)]">오방신장부</h3><span class="text-xs text-[var(--color-galsaek)] opacity-70">五方神將符</span></div><p class="mt-0.5 line-clamp-1 text-xs text-[var(--color-galsaek)]">동·서·남·북·중앙 다섯 방위를 관장하는 신장의 힘으로 사방의 악귀를 물리칩니다. 집안 전체를 지키는 최상급 벽사 부적입니다.</p></div><span class="shrink-0 text-xs text-[var(--color-galsaek)] opacity-50">›</span></button><button class="hanji-card flex items-center gap-3 rounded-xl p-3 text-left" tabindex="0" style="opacity:0;transform:translateY(16px)"><div class="relative shrink-0"><div class="" style="width:48px;height:67.19999999999999px"><img src="/bujeok-app/talismans/%EC%B2%9C%EC%99%95%EB%B6%80-%EC%A0%84%ED%86%B5.png" alt="" class="h-full w-full object-cover" style="border-radius:6px;border:1px solid rgba(122, 74, 52, 0.35);filter:grayscale(1);opacity:0.55"/></div></div><div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="inline-block h-2 w-2 shrink-0 rounded-full" style="background-color:#A72B21"></span><h3 class="truncate font-serif-kr text-sm font-bold text-[var(--color-galsaek)]">천왕부</h3><span class="text-xs text-[var(--color-galsaek)] opacity-70">天王符</span></div><p class="mt-0.5 line-clamp-1 text-xs text-[var(--color-galsaek)]">불교 사천왕(四天王)의 위력을 빌려 사방의 마귀를 물리치는 부적입니다. 절 입구 사천왕문과 같은 수호 기능을 합니다.</p></div><span class="shrink-0 text-xs text-[var(--color-galsaek)] opacity-50">›</span></button><button class="hanji-card flex items-center gap-3 rounded-xl p-3 text-left" tabindex="0" style="opacity:0;transform:translateY(16px)"><div class="relative shrink-0"><div class="" style="width:48px;height:67.19999999999999px"><img src="/bujeok-app/talismans/%ED%98%B8%EC%8B%A0%EB%B6%80-%EC%A0%84%ED%86%B5.png" alt="" class="h-full w-full object-cover" style="border-radius:6px;border:1px solid rgba(122, 74, 52, 0.35);filter:grayscale(1);opacity:0.55"/></div></div><div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="inline-block h-2 w-2 shrink-0 rounded-full" style="background-color:#A72B21"></span><h3 class="truncate font-serif-kr text-sm font-bold text-[var(--color-galsaek)]">호신부</h3><span class="text-xs text-[var(--color-galsaek)] opacity-70">護身符</span></div><p class="mt-0.5 line-clamp-1 text-xs text-[var(--color-galsaek)]">몸을 보호하여 각종 재난·사고·질병으로부터 지켜주는 개인 수호 부적입니다. 항상 몸에 지니고 다닙니다.</p></div><span class="shrink-0 text-xs text-[var(--color-galsaek)] opacity-50">›</span></button><button class="hanji-card flex items-center gap-3 rounded-xl p-3 text-left" tabindex="0" style="opacity:0;transform:translateY(16px)"><div class="relative shrink-0"><div class="" style="width:48px;height:67.19999999999999px"><img src="/bujeok-app/talismans/%EC%88%98%EC%82%B4%EB%A7%89%EC%9D%B4%EB%B6%80-%EC%A0%84%ED%86%B5.png" alt="" class="h-full w-full object-cover" style="border-radius:6px;border:1px solid rgba(122, 74, 52, 0.35);filter:grayscale(1);opacity:0.55"/></div></div><div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="inline-block h-2 w-2 shrink-0 rounded-full" style="background-color:#A72B21"></span><h3 class="truncate font-serif-kr text-sm font-bold text-[var(--color-galsaek)]">수살막이부</h3><span class="text-xs text-[var(--color-galsaek)] opacity-70">水煞防符</span></div><p class="mt-0.5 line-clamp-1 text-xs text-[var(--color-galsaek)]">물과 관련된 재앙의 기운(수살)을 막아주는 부적입니다. 수재·익사 사고 등 물로 인한 위험을 예방합니다.</p></div><span class="shrink-0 text-xs text-[var(--color-galsaek)] opacity-50">›</span></button><button class="hanji-card flex items-center gap-3 rounded-xl p-3 text-left" tabindex="0" style="opacity:0;transform:translateY(16px)"><div class="relative shrink-0"><div class="" style="width:48px;height:67.19999999999999px"><img src="/bujeok-app/talismans/%EC%82%BC%EC%9E%AC%EB%B6%80-%EC%A0%84%ED%86%B5.png" alt="" class="h-full w-full object-cover" style="border-radius:6px;border:1px solid rgba(122, 74, 52, 0.35);filter:grayscale(1);opacity:0.55"/></div></div><div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="inline-block h-2 w-2 shrink-0 rounded-full" style="background-color:#A72B21"></span><h3 class="truncate font-serif-kr text-sm font-bold text-[var(--color-galsaek)]">삼재부</h3><span class="text-xs text-[var(--color-galsaek)] opacity-70">三災符</span></div><p class="mt-0.5 line-clamp-1 text-xs text-[var(--color-galsaek)]">수재·화재·풍재의 세 가지 재앙(삼재)을 막아주는 부적입니다. 띠에 따라 3년 주기로 드는 삼재를 소멸시킵니다.</p></div><span class="shrink-0 text-xs text-[var(--color-galsaek)] opacity-50">›</span></button><button class="hanji-card flex items-center gap-3 rounded-xl p-3 text-left" tabindex="0" style="opacity:0;transform:translateY(16px)"><div class="relative shrink-0"><div class="" style="width:48px;height:67.19999999999999px"><img src="/bujeok-app/talismans/%EB%B6%80%EB%8F%84%EC%98%B9%EB%B6%80-%EC%A0%84%ED%86%B5.png" alt="" class="h-full w-full object-cover" style="border-radius:6px;border:1px solid rgba(122, 74, 52, 0.35);filter:grayscale(1);opacity:0.55"/></div></div><div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="inline-block h-2 w-2 shrink-0 rounded-full" style="background-color:#A72B21"></span><h3 class="truncate font-serif-kr text-sm font-bold text-[var(--color-galsaek)]">부도옹부</h3><span class="text-xs text-[var(--color-galsaek)] opacity-70">不倒翁符</span></div><p class="mt-0.5 line-clamp-1 text-xs text-[var(--color-galsaek)]">오뚝이처럼 어떤 어려움에도 쓰러지지 않고 다시 일어서는 힘을 주는 부적입니다. 실패 후 재기를 도모할 때 사용합니다.</p></div><span class="shrink-0 text-xs text-[var(--color-galsaek)] opacity-50">›</span></button><button class="hanji-card flex items-center gap-3 rounded-xl p-3 text-left" tabindex="0" style="opacity:0;transform:translateY(16px)"><div class="relative shrink-0"><div class="" style="width:48px;height:67.19999999999999px"><img src="/bujeok-app/talismans/%EA%B2%BD%EB%A9%B4%EC%A3%BC%EC%82%AC%EB%B6%80-%EC%A0%84%ED%86%B5.png" alt="" class="h-full w-full object-cover" style="border-radius:6px;border:1px solid rgba(122, 74, 52, 0.35);filter:grayscale(1);opacity:0.55"/></div></div><div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="inline-block h-2 w-2 shrink-0 rounded-full" style="background-color:#A72B21"></span><h3 class="truncate font-serif-kr text-sm font-bold text-[var(--color-galsaek)]">경면주사부</h3><span class="text-xs text-[var(--color-galsaek)] opacity-70">鏡面朱砂符</span></div><p class="mt-0.5 line-clamp-1 text-xs text-[var(--color-galsaek)]">거울처럼 맑게 정제한 최고급 주사로 그린 최상급 벽사 부적입니다. 강력한 악귀나 원귀를 물리칠 때 사용합니다.</p></div><span class="shrink-0 text-xs text-[var(--color-galsaek)] opacity-50">›</span></button><button class="hanji-card flex items-center gap-3 rounded-xl p-3 text-left" tabindex="0" style="opacity:0;transform:translateY(16px)"><div class="relative shrink-0"><div class="" style="width:48px;height:67.19999999999999px"><img src="/bujeok-app/talismans/%EC%B4%88%EB%B3%B5%EB%B6%80-%EC%A0%84%ED%86%B5.png" alt="" class="h-full w-full object-cover" style="border-radius:6px;border:1px solid rgba(122, 74, 52, 0.35);filter:grayscale(1);opacity:0.55"/></div></div><div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="inline-block h-2 w-2 shrink-0 rounded-full" style="background-color:#DAA017"></span><h3 class="truncate font-serif-kr text-sm font-bold text-[var(--color-galsaek)]">초복부</h3><span class="text-xs text-[var(--color-galsaek)] opacity-70">招福符</span></div><p class="mt-0.5 line-clamp-1 text-xs text-[var(--color-galsaek)]">복을 불러들이는 가장 기본적인 복 부적입니다. 새해·생일·새 출발 등 길한 시작에 두루 사용합니다.</p></div><span class="shrink-0 text-xs text-[var(--color-galsaek)] opacity-50">›</span></button><button class="hanji-card flex items-center gap-3 rounded-xl p-3 text-left" tabindex="0" style="opacity:0;transform:translateY(16px)"><div class="relative shrink-0"><div class="" style="width:48px;height:67.199999 le="width:48px;height:67.19999999999999px"><img src="/bujeok-app/talismans/%EC%8A%B9%EC%A7%84%EB%B6%80-%EC%A0%84%ED%86%B5.png" alt="" class="h-full w-full object-cover" style="border-radius:6px;border:1px solid rgba(122, 74, 52, 0.35);filter:grayscale(1);opacity:0.55"/></div></div><div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="inline-block h-2 w-2 shrink-0 rounded-full" style="background-color:#DAA017"></span><h3 class="truncate font-serif-kr text-sm font-bold text-[var(--color-galsaek)]">승진부</h3><span class="text-xs text-[var(--color-galsaek)] opacity-70">昇進符</span></div><p class="mt-0.5 line-clamp-1 text-xs text-[var(--color-galsaek)]">직장에서의 승진과 관운(官運)의 형통을 기원하는 부적입니다. 승진 심사나 진급을 앞두고 사용합니다.</p></div><span class="shrink-0 text-xs text-[var(--color-galsaek)] opacity-50">›</span></button><button class="hanji-card flex items-center gap-3 rounded-xl p-3 text-left" tabindex="0" style="opacity:0;transform:translateY(16px)"><div class="relative shrink-0"><div class="" style="width:48px;height:67.19999999999999px"><img src="/bujeok-app/talismans/%EA%B0%9C%EC%97%85%EB%8C%80%EA%B8%B8%EB%B6%80-%EC%A0%84%ED%86%B5.png" alt="" class="h-full w-full object-cover" style="border-radius:6px;border:1px solid rgba(122, 74, 52, 0.35);filter:grayscale(1);opacity:0.55"/></div></div><div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="inline-block h-2 w-2 shrink-0 rounded-full" style="background-color:#DAA017"></span><h3 class="truncate font-serif-kr text-sm font-bold text-[var(--color-galsaek)]">개업대길부</h3><span class="text-xs text-[var(--color-galsaek)] opacity-70">開業大吉符</span></div><p class="mt-0.5 line-clamp-1 text-xs text-[var(--color-galsaek)]">새 사업의 번창과 큰 이익을 기원하는 부적입니다. 손님이 몰리고 사고 없이 순탄하게 운영되기를 빕니다.</p></div><span class="shrink-0 text-xs text-[var(--color-galsaek)] opacity-50">›</span></button><button class="hanji-card flex items-center gap-3 rounded-xl p-3 text-left" tabindex="0" style="opacity:0;transform:translateY(16px)"><d ek)] opacity-70">聰明符</span></div><p class="mt-0.5 line-clamp-1 text-xs text-[var(--color-galsaek)]">머리를 밝히고 지혜를 열어주는 부적입니다. 기억력·이해력·집중력 등 학습 능력 전반을 높여줍니다.</p></div><span class="shrink-0 text-xs text-[var(--color-galsaek)] opacity-50">›</span></button><button class="hanji-card flex items-center gap-3 rounded-xl p-3 text-left" tabindex="0" style="opacity:0;transform:translateY(16px)"><div class="relative shrink-0"><div class="" style="width:48px;height:67.19999999999999px"><img src="/bujeok-app/talismans/%EB%AC%B8%EC%B0%BD%EB%B6%80-%EC%A0%84%ED%86%B5.png" alt="" class="h-full w-full object-cover" style="border-radius:6px;border:1px solid rgba(122, 74, 52, 0.35);filter:grayscale(1);opacity:0.55"/></div></div><div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="inline-block h-2 w-2 shrink-0 rounded-full" style="background-color:#2E2E2E"></span><h3 class="truncate font-serif-kr text-sm font-bold text-[var(--color-galsaek)]">문창부</h3><span class="text-xs text-[var(--color-galsaek)] opacity-70">文昌符</span></div><p class="mt-0.5 line-clamp-1 text-xs text-[var(--color-galsaek)]">문창성(文昌星)의 기운을 빌려 학문과 문장력을 높이는 부적입니다. 논술·집필 등 글쓰기에 사용합니다.</p></div><span class="shrink-0 text-xs text-[var(--color-galsaek)] opacity-50">›</span></button><button class="hanji-card flex items-center gap-3 rounded-xl p-3 text-left" tabindex="0" style="opacity:0;transform:translateY(16px)"><div class="relative shrink-0"><div class="" style="width:48px;height:67.19999999999999px"><img src="/bujeok-app/talismans/%EC%A7%91%EC%A4%91%EB%B6%80-%EC%A0%84%ED%86%B5.png" alt="" class="h-full w-full object-cover" style="border-radius:6px;border:1px solid rgba(122, 74, 52, 0.35);filter:grayscale(1);opacity:0.55"/></div></div><div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="inline-block h-2 w-2 shrink-0 rounded-full" style="background-color:#2E2E2E"></span><h3 class="truncate font-serif-kr text-sm font-bold text-[var(--color-galsaek)]">집중부</h3><span class="text-xs t
